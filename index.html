<!DOCTYPE html>
<!--paisa-tracker-app-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeBird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: a pocket cash diary — quick, calm, never preachy.
   IDEA: a wallet you can see into; cash in hand is the headline, the day's in/out flows under it.
   PICTURE: big cash-in-hand readout with today's received/spent split bar, two fat action buttons.
   COLOUR and TYPE: aluminium ground, ink, orange #ff4f00 for money out, green for money in; Geist + Geist Mono digits.
   LAYOUT: single phone column; header + drawer; sheets slide from the bottom. */
:root{color-scheme:light dark;--bg:light-dark(#ecedef,#121315);--card:light-dark(#fafafa,#1c1e21);--ink:light-dark(#121315,#eceef0);--mute:light-dark(#62666d,#9aa0a8);--line:light-dark(#d6d8dc,#2c2f34);--acc:#ff4f00;--in:light-dark(#0a7a45,#3fcf8e);--soft:light-dark(#f1f2f4,#25282c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Geist,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--in)}.out{color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 120px}
header{display:flex;align-items:center;gap:6px;padding:4px 0 12px}
header h1{font-size:20px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
.ib{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.ib svg{width:22px;height:22px}
.nav{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px}
.nav button{width:40px;height:40px;border:0;background:none;font-size:20px;border-radius:999px;cursor:pointer}
.nav span{font-weight:500;font-size:14px;min-width:84px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.lbl{font-size:13px;color:var(--mute)}
.big{font-size:clamp(40px,12vw,54px);line-height:1.05;font-weight:500;letter-spacing:-.03em;margin:4px 0 2px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.split div{border-top:1px solid var(--line);padding-top:8px}.split b{display:block;font-size:20px;font-weight:500}
.flowbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:14px}
.flowbar i{display:block;height:100%}.flowbar .bi{background:var(--in)}.flowbar .bo{background:var(--acc)}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bigbtn{height:56px;border-radius:16px;border:0;font-weight:600;font-size:16px;cursor:pointer}
.bigbtn.rcv{background:var(--in);color:#fff}.bigbtn.spd{background:var(--ink);color:var(--card)}
h2{font-size:15px;font-weight:600;margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--acc);font-weight:500;font-size:14px;padding:8px 0;cursor:pointer}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qb{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-size:14px;display:flex;gap:6px;align-items:center}
.qb .num{color:var(--mute)}
.check{display:flex;gap:12px;align-items:center;justify-content:space-between}
.check.due{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.pill{height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer;flex:none}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tx{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;cursor:pointer;min-height:60px}
.tx:first-child{border-top:0}
.ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:13px}
.ic.i{background:color-mix(in srgb,var(--in) 14%,transparent);color:var(--in)}
.tx .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .s{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:26px 18px;text-align:center;color:var(--mute);font-size:15px}
.day{font-size:13px;color:var(--mute);margin:14px 2px 6px;display:flex;justify-content:space-between}
.cats{display:grid;gap:10px}
.cat{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.cats.o .cat:first-child .bar i{background:var(--acc)}.cats.g .bar i{background:var(--in)}
.scale{position:relative;height:10px;background:var(--line);border-radius:5px;margin-top:14px;overflow:hidden}.scale i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:5px;transition:width .4s}
.over .scale i{background:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:14px}
.drow{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.drow:first-child{border-top:0}.dbars{display:grid;gap:4px}.dbars i{display:block;height:7px;border-radius:4px;min-width:2px}
.fcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px;cursor:pointer}
.fcard .nm{font-weight:600;font-size:17px}
.pbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:10px 0 6px}.pbar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.pbar.done i{background:var(--in)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(22px + env(safe-area-inset-bottom));height:58px;padding:0 24px;border:0;border-radius:999px;background:var(--acc);color:#fff;font-weight:600;font-size:17px;box-shadow:0 8px 24px rgba(255,79,0,.35);cursor:pointer;z-index:5}
.layer .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.layer.open .scrim{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;z-index:10;max-height:92vh;overflow-y:auto}
.layer.open .sheet{transform:none}
.grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.sheet h3{font-size:20px;margin:4px 0 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{height:42px;border:0;border-radius:9px;background:none;color:var(--mute);font-weight:500;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amt{display:flex;align-items:baseline;gap:6px;margin:16px 0 4px;border-bottom:2px solid var(--acc);padding-bottom:4px}
.amt.g{border-color:var(--in)}
.amt span{font-size:30px;color:var(--mute)}
.amt input{flex:1;border:0;background:none;color:var(--ink);font:500 40px "Geist Mono",monospace;width:100%;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:none;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.f{display:grid;gap:4px;font-size:13px;color:var(--mute);margin-bottom:10px}
.f input,.f select{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:0 12px;font:16px Geist,sans-serif;width:100%}
.btns{display:flex;gap:10px;margin-top:14px}
.save{flex:1;height:52px;border:0;border-radius:14px;background:var(--ink);color:var(--card);font-weight:600;cursor:pointer}
.save.g{background:var(--in);color:#fff}.save.o{background:var(--acc);color:#fff}
.ghost{height:52px;padding:0 18px;border:1px solid var(--line);border-radius:14px;background:none;font-weight:500;cursor:pointer}
.ghost.red{color:var(--acc)}
.err{color:var(--acc);font-size:13px;min-height:18px}
.qr{background:#fff;border-radius:16px;padding:14px;width:min(230px,66vw);margin:10px auto}.qr svg{display:block;width:100%;height:auto}
.hrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.x{width:36px;height:36px;border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(310px,84vw);background:var(--card);z-index:12;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;overflow-y:auto}
#dlayer.open .drawer{transform:none}#dlayer .scrim{z-index:11}
.who{display:flex;gap:12px;align-items:center;padding:28px 20px 18px;border-bottom:1px solid var(--line)}
.av{width:50px;height:50px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:600;font-size:19px;flex:none}
.av.e{background:var(--line);color:var(--mute)}
.who b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msec{font-size:12px;color:var(--mute);padding:16px 20px 6px}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 20px;border:0;background:none;font-weight:500;text-align:left;cursor:pointer}
.mi.on{background:var(--soft)}.mi svg{width:20px;height:20px;color:var(--mute);flex:none}
.mfoot{margin-top:auto;padding:16px 20px;font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:10px 8px 10px 16px;border-radius:12px;display:flex;gap:10px;align-items:center;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--acc);font-weight:600;padding:6px 10px;cursor:pointer}
.search{width:100%;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;font:16px Geist,sans-serif;color:var(--ink);margin-bottom:4px}
.slice{background:var(--soft);border-radius:16px;padding:14px;margin:4px 0 12px}
.slice input[type=range]{width:100%;accent-color:var(--in);height:32px;margin:6px 0 2px}
.pct{display:flex;gap:6px;flex-wrap:wrap}.pct button{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13px;cursor:pointer}
.pct button.on{background:var(--in);border-color:var(--in);color:#fff}
.sv{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.sv:first-child{border-top:0}
.av.e{background:#111214;overflow:hidden}
.av .bird{width:44px;height:44px;animation:bfloat 2.4s ease-in-out infinite}
.av .wf{transform-box:fill-box;transform-origin:50% 100%;animation:flap .6s ease-in-out infinite alternate}
.av .wb{transform-box:fill-box;transform-origin:10% 100%;animation:flap .6s ease-in-out infinite alternate-reverse}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
@keyframes bfloat{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.av .bird,.av .wf,.av .wb{animation:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="ib" id="burger" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1 id="title">Daily Flow</h1>
    <div class="nav" id="dnav"><button id="dprev" aria-label="Previous">‹</button><span id="dlabel"></span><button id="dnext" aria-label="Next">›</button></div>
  </header>

  <!-- DAILY FLOW -->
  <main id="v-flow">
    <section class="card">
      <div class="lbl">Cash in hand</div>
      <div class="big num" id="cih">₹0</div>
      <div class="lbl" id="cihNote"></div>
      <div class="split" style="grid-template-columns:1fr">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="border:0;padding:0"><span class="lbl" id="rcvL">Received today</span><b class="num in" id="rcv">₹0</b></div>
        <button class="bigbtn rcv" id="bRcv" style="height:44px;padding:0 18px;font-size:15px;border-radius:12px;flex:none">+ Add your funds</button></div>
      </div>
    </section>
    <h2>Quick add <button class="link" id="qEdit">Edit</button></h2>
    <div class="quick" id="quick"></div>
    <h2 id="dayH">Today</h2>
    <div id="dayList"></div>
  </main>

  <!-- EXPENSES -->
  <main id="v-exp" hidden>
    <section class="card">
      <div class="lbl" id="exL">Spent today</div>
      <div class="big num" id="exDay">₹0</div>
      <div class="split" style="grid-template-columns:1fr"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div style="border:0;padding:0"><span class="lbl" id="exML">This month</span><b class="num" id="exMon">₹0</b></div>
        <button class="bigbtn spd" id="exAdd" style="height:44px;padding:0 18px;font-size:15px;border-radius:12px;flex:none;background:var(--acc);color:#fff">+ Add expense</button></div></div>
    </section>
    <h2>Where it went</h2><div class="cats o" id="exCats"></div>
    <h2 id="exH">Today</h2><div id="exList"></div>
  </main>

  <!-- SAVINGS -->
  <main id="v-sav" hidden>
    <section class="card">
      <div class="lbl">Total savings</div>
      <div class="big num in" id="svTot">₹0</div>
      <div class="split" style="grid-template-columns:1fr"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span class="lbl" id="svSub" style="border:0;padding:0">Money you add from Slice lands here.</span>
        <button class="bigbtn rcv" id="svAdd" style="height:44px;padding:0 18px;font-size:15px;border-radius:12px;flex:none">+ Add funds</button></div></div>
    </section>
    <h2>Saving for</h2><div class="cats g" id="svBy"></div>
    <h2>History</h2><div id="svList"></div>
  </main>
</div>

</div>

<button class="fab" id="fab" hidden>+ Add</button>

<div class="layer" id="dlayer"><div class="scrim" data-close></div><nav class="drawer" aria-label="Menu">
  <div class="who"><div class="av e" id="mAv" aria-hidden="true"></div><div style="min-width:0"><b id="mName">Not signed in</b><button class="link" id="mSign" style="padding:2px 0">Sign in</button></div></div>
  <div class="msec">Track</div>
  <button class="mi" data-v="flow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Daily Flow</button>
      <button class="mi" data-v="exp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v12H3zM3 11h18M7 15h4"/></svg>Expenses</button>
  <button class="mi" data-v="sav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11a7 6 0 0 1 14 0v3a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3zM9 20v-3M15 20v-3M12 5V3"/></svg>Savings</button>
    <div class="msec">Account</div>
  <button class="mi" id="mProf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg><span id="mProfL">Sign in</span></button>
  <div class="mfoot">FreeBird · Your key to financial freedom</div>
</nav></div>

<div class="layer" id="slayer"><div class="scrim" data-close></div><div class="sheet" id="sheet"></div></div>
<div id="backmark" hidden></div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tbtn" hidden>Undo</button></div>

<script>
{
const $=id=>document.getElementById(id);
const AND=window.Android||null;
const LS='paisa-tracker-v1';
const CAT_OUT=['Food','Chai/Snacks','Travel','Shopping','Bills','Rent','Recharge','Health','Fun','Education','Untracked','Other'];
const CAT_IN=['Slice','Parents','Family','Friends','Freelance','Gift','Refund','Borrowed','Found','Other'];
const MODES=['Cash','UPI','Card','Bank'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
const sinr=n=>(n<0?'−':'')+inr(n);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=a=>a.reduce((x,t)=>x+t.a,0);
const num=v=>{const n=parseFloat(String(v||'').replace(/[,₹\s]/g,''));return isFinite(n)?n:NaN};
const dayLabel=d=>d===today()?'Today':new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const monLabel=m=>{const [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleString('en-IN',{month:'short',year:'numeric'})};

// ---------- State ----------
let S={txns:[],budget:0,funds:[],fx:[],upi:{},profile:null,sav:null,checks:[],quick:null,saves:[]};
const DEF_QUICK=[{n:'Chai',a:20,c:'Chai/Snacks'},{n:'Auto',a:50,c:'Travel'},{n:'Lunch',a:100,c:'Food'},{n:'Metro',a:40,c:'Travel'}];
function load(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(!j)return;
  S.txns=(Array.isArray(j.txns)?j.txns:[]).filter(t=>t&&t.id&&(t.t==='e'||t.t==='i')&&+t.a>0&&/^\d{4}-\d{2}-\d{2}$/.test(t.d)).map(t=>({id:String(t.id),t:t.t,a:+t.a,c:String(t.c||'Other'),n:String(t.n||''),d:t.d,m:String(t.m||''),ts:+t.ts||0}));
  S.budget=+j.budget||0;S.funds=Array.isArray(j.funds)?j.funds:[];S.fx=Array.isArray(j.fx)?j.fx:[];
  S.upi=j.upi&&typeof j.upi==='object'?j.upi:{};S.profile=j.profile&&j.profile.name?j.profile:null;
  S.sav=j.sav&&isFinite(+j.sav.amt)?{amt:+j.sav.amt,ts:+j.sav.ts||0}:null;
  S.checks=Array.isArray(j.checks)?j.checks.filter(c=>isFinite(+c.amt)):[];
  S.quick=Array.isArray(j.quick)?j.quick:null;
  S.saves=(Array.isArray(j.saves)?j.saves:[]).filter(s=>s&&s.id&&+s.a>0).map(s=>({id:String(s.id),a:+s.a,n:String(s.n||'General'),d:String(s.d||today()),tx:s.tx?String(s.tx):'',ts:+s.ts||0}))}catch(e){}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Could not save on this phone')}}
const quick=()=>S.quick||DEF_QUICK;

// ---------- Cash maths ----------
const isCash=t=>t.m==='Cash';
function lastCheck(){return S.checks.length?S.checks.reduce((a,b)=>b.ts>a.ts?b:a):null}
function cashInHand(){const after=S.txns.filter(isCash);
  const ids=new Set(after.map(t=>t.id));
  return sum(after.filter(t=>t.t==='i'))-sum(after.filter(t=>t.t==='e'))-sum(S.saves.filter(s=>ids.has(s.tx)))}
const saveOf=id=>S.saves.find(s=>s.tx===id);
function savNow(){if(!S.sav)return null;const after=S.txns.filter(t=>t.ts>S.sav.ts);return S.sav.amt+sum(after.filter(t=>t.t==='i'))-sum(after.filter(t=>t.t==='e'))}
const fSaved=id=>S.fx.filter(x=>x.f===id).reduce((a,x)=>a+x.a,0);

// ---------- Views ----------
const TITLES={flow:'Daily Flow',exp:'Expenses',sav:'Savings'};
let cur='flow',day=today(),month=today().slice(0,7);
function setView(v){if(!TITLES[v])v='flow';cur=v;
  for(const k in TITLES)$('v-'+k).hidden=k!==v;
  $('title').textContent=TITLES[v];
  $('dnav').style.visibility=v==='sav'?'hidden':'visible';
  $('backmark').classList.toggle('open',v!=='flow');
  try{localStorage.setItem(LS+'-view2',v)}catch(e){}
  render();window.scrollTo(0,0)}
new MutationObserver(()=>{if(!$('backmark').classList.contains('open')&&cur!=='flow')setView('flow')}).observe($('backmark'),{attributes:true});
function shiftNav(n){if(cur!=='sav'){const d=new Date(day+'T00:00');d.setDate(d.getDate()+n);const nd=ymd(d);if(nd>today())return;day=nd}
  else{let [y,m]=month.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}month=y+'-'+String(m).padStart(2,'0')}render()}
$('dprev').onclick=()=>shiftNav(-1);$('dnext').onclick=()=>shiftNav(1);

function txRow(t){return `<button class="tx" data-id="${esc(t.id)}"><span class="ic ${t.t==='i'?'i':''}">${esc(t.c.slice(0,2))}</span><span><div class="t">${esc(t.n||t.c)}</div><div class="s">${esc(t.c)}${t.m?' · '+esc(t.m):''}</div></span><span class="num ${t.t==='i'?'in':''}">${t.t==='i'?'+':'−'}${inr(t.a)}</span></button>`}
function grouped(list){const days={};list.forEach(t=>(days[t.d]=days[t.d]||[]).push(t));
  return Object.entries(days).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,ts])=>{const net=ts.reduce((a,t)=>a+(t.t==='i'?t.a:-t.a),0);
    return `<div class="day"><span>${esc(dayLabel(d))}</span><span class="num">${net<0?'−':'+'}${inr(net)}</span></div><div class="list">${ts.sort((a,b)=>b.ts-a.ts).map(txRow).join('')}</div>`}).join('')}
function bars(map,cls){const r=Object.entries(map).sort((a,b)=>b[1]-a[1]);if(!r.length)return null;const m=r[0][1];
  return r.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><div class="bar"><i style="width:${(v/m*100).toFixed(1)}%"></i></div><span class="num">${inr(v)}</span></div>`).join('')}

function render(){
  $('dlabel').textContent=cur==='sav'?monLabel(month):dayLabel(day);
  if(cur==='flow')rFlow();else if(cur==='exp')rExp();else rSav()}
function rExp(){
  const isT=day===today(),dt=S.txns.filter(t=>t.t==='e'&&t.d===day),mo=S.txns.filter(t=>t.t==='e'&&t.d.slice(0,7)===day.slice(0,7));
  $('exL').textContent=isT?'Spent today':'Spent on '+dayLabel(day);$('exDay').textContent=inr(sum(dt));
  $('exML').textContent=monLabel(day.slice(0,7));$('exMon').textContent=inr(sum(mo));
  const by={};dt.forEach(t=>by[t.c]=(by[t.c]||0)+t.a);
  $('exCats').innerHTML=bars(by)||'<div class="lbl">Nothing spent '+(isT?'today':'this day')+'.</div>';
  $('exH').textContent=isT?'Today':dayLabel(day);
  $('exList').innerHTML=dt.length?`<div class="list">${dt.sort((a,b)=>b.ts-a.ts).map(txRow).join('')}</div>`:'<div class="list"><div class="empty">No expenses yet. Tap <b>+ Add expense</b>.</div></div>'}
$('exAdd').onclick=()=>entrySheet('e');

function rFlow(){
  $('cih').textContent=sinr(cashInHand());
  $('cihNote').textContent='Cash received, minus spent and saved';
  const dt=S.txns.filter(t=>t.d===day),ri=sum(dt.filter(t=>t.t==='i'));
  const isT=day===today();$('rcvL').textContent=isT?'Received today':'Received';$('rcv').textContent=inr(ri);
  $('quick').innerHTML=quick().map((q,i)=>`<button class="qb" data-q="${i}">${esc(q.n)} <span class="num">${inr(q.a)}</span></button>`).join('');
  $('dayH').textContent=isT?'Today':dayLabel(day);
  $('dayList').innerHTML=dt.length?`<div class="list">${dt.sort((a,b)=>b.ts-a.ts).map(txRow).join('')}</div>`:'<div class="list"><div class="empty">Nothing yet. Tap <b>+ Add your funds</b> to add cash you got.</div></div>';
}
function rSav(){
  const tot=sum(S.saves);$('svTot').textContent=inr(tot);
  $('svSub').textContent=S.saves.length?S.saves.length+(S.saves.length>1?' entries':' entry'):'Money you add from Slice lands here.';
  const by={};S.saves.forEach(s=>by[s.n]=(by[s.n]||0)+s.a);
  $('svBy').innerHTML=bars(by)||'<div class="lbl">Nothing saved yet. Tap <b>+ Add your funds</b> and choose <b>Slice</b>, it goes straight here.</div>';
  const list=S.saves.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts);
  $('svList').innerHTML=list.length?'<div class="list">'+list.map(s=>{const t=S.txns.find(x=>x.id===s.tx);
    return `<div class="sv"><span class="ic i">${esc(s.n.slice(0,2))}</span><span style="min-width:0"><div class="t" style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.n)}</div><div class="lbl">${esc(dayLabel(s.d))}${t?' · from '+esc(t.c)+' '+inr(t.a):''}</div></span><span style="display:flex;align-items:center;gap:2px"><span class="num in">+${inr(s.a)}</span><button class="x" data-s="${esc(s.id)}" aria-label="Remove">×</button></span></div>`}).join('')+'</div>':'';
}
$('svAdd').onclick=()=>{openSheet(`<h3>Add to savings</h3>
  <label class="amt g"><span>₹</span><input id="vA" inputmode="decimal" placeholder="0" aria-label="Amount"></label><div class="err" id="vErr"></div>
  <label class="f">What is it for? (optional)<input id="vF" maxlength="24" placeholder="e.g. Bike, Emergency" list="vList"></label>
  <datalist id="vList">${[...new Set(S.saves.map(s=>s.n))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <label class="f">Date<input id="vD" type="date" max="${today()}" value="${today()}"></label>
  <div class="btns"><button type="button" class="save g" id="vSave">Add to savings</button></div>`);focusLater('vA');
  $('vSave').onclick=()=>{const a=num($('vA').value);if(!(a>0)||a>1e10){$('vErr').textContent='Enter an amount';return}
    const s={id:uid(),a:Math.round(a*100)/100,n:($('vF').value.trim()||'General').slice(0,24),d:$('vD').value||today(),tx:'',ts:Date.now()};
    S.saves.push(s);save();closeSheet();render();toast(inr(s.a)+' added to savings',()=>{S.saves=S.saves.filter(x=>x!==s);save();render()})}};
$('svList').onclick=e=>{const b=e.target.closest('.x');if(!b)return;const s=S.saves.find(x=>x.id===b.dataset.s);if(!s)return;
  S.saves=S.saves.filter(x=>x!==s);save();render();toast('Removed from savings',()=>{S.saves.push(s);save();render()})};

// ---------- Sheet ----------
const sheet=$('sheet');
function openSheet(html){sheet.innerHTML='<div class="grab"></div>'+html;$('slayer').classList.add('open')}
function closeSheet(){$('slayer').classList.remove('open');if(document.activeElement)document.activeElement.blur()}
document.querySelectorAll('[data-close]').forEach(s=>s.onclick=()=>{closeSheet();closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeMenu()}});
const focusLater=id=>setTimeout(()=>{const e=$(id);e&&e.focus()},260);
function chips(list,sel){return list.map(c=>`<button type="button" class="chip${c===sel?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
function bindChips(box,cb){box.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;box.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.c)}}

// Entry sheet: received / spent
function entrySheet(type,tx){let t=tx?tx.t:type,c=tx?tx.c:(t==='i'?'Parents':'Food');const sv=tx?saveOf(tx.id):null;
  const draw=()=>{openSheet(`<h3>${t==='i'?(tx?'Edit funds':'Add your funds'):(tx?'Edit expense':'Add expense')}</h3>
    <label class="amt ${t==='i'?'g':''}"><span>₹</span><input id="eAmt" inputmode="decimal" placeholder="0" aria-label="Amount" value="${tx?tx.a:''}"></label>
    <div class="err" id="eErr"></div>
    <div class="lbl">${t==='i'?'Where did it come from?':'What was it for?'}</div>
    <div class="chips" id="eCats">${chips(t==='i'?CAT_IN:CAT_OUT,c)}</div>
    <div class="two"><label class="f">Date<input id="eDate" type="date" max="${today()}" value="${tx?tx.d:day}"></label>
    <label class="f">Paid with<select id="eMode">${MODES.map(m=>`<option${(tx?tx.m:'Cash')===m?' selected':''}>${m}</option>`).join('')}</select></label></div>
    <label class="f">Note (optional)<input id="eNote" maxlength="60" placeholder="${t==='i'?'e.g. Pocket money':'e.g. Chai with friends'}" value="${tx?esc(tx.n):''}"></label>
    <div class="slice" id="slBox"${t==='i'&&c==='Slice'?'':' hidden'}><b class="in">Goes straight to Savings</b>
      <label class="f" style="margin:10px 0 0">What is it for? (optional)<input id="slF" maxlength="24" placeholder="e.g. Bike, Emergency" value="${sv&&sv.n!=='Slice'?esc(sv.n):''}" list="slList"></label>
      <datalist id="slList">${[...new Set(S.saves.map(s=>s.n))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="btns">${tx?'<button type="button" class="ghost red" id="eDel">Delete</button>':''}<button type="button" class="save ${t==='i'?'g':''}" id="eSave">${tx?'Update':(t==='i'?'Add funds':'Add expense')}</button></div>`);
    bindChips($('eCats'),v=>{c=v;$('slBox').hidden=!(t==='i'&&c==='Slice')});
    $('eSave').onclick=()=>{const a=num($('eAmt').value);if(!(a>0)){$('eErr').textContent='Enter an amount';return}if(a>1e9){$('eErr').textContent='Amount is too large';return}
      const rec={id:tx?tx.id:uid(),t,a:Math.round(a*100)/100,c,n:$('eNote').value.trim().slice(0,60),d:$('eDate').value||today(),m:$('eMode').value,ts:tx?tx.ts:Date.now()};
      if(tx)S.txns=S.txns.map(x=>x.id===rec.id?rec:x);else S.txns.push(rec);
      S.saves=S.saves.filter(s=>s.tx!==rec.id);let sl=0;
      if(t==='i'&&c==='Slice'){sl=rec.a;S.saves.push({id:sv?sv.id:uid(),a:sl,n:($('slF').value.trim()||'Slice').slice(0,24),d:rec.d,tx:rec.id,ts:sv?sv.ts:Date.now()})}
      save();closeSheet();render();toast(tx?'Updated':(t==='i'?'Added '+inr(rec.a)+(sl?' to Savings':''):'Spent '+inr(rec.a)))};
    if(tx)$('eDel').onclick=()=>{const gone=tx,gs=S.saves.filter(s=>s.tx===tx.id);S.txns=S.txns.filter(x=>x.id!==tx.id);S.saves=S.saves.filter(s=>s.tx!==tx.id);save();closeSheet();render();toast('Entry deleted',()=>{S.txns.push(gone);S.saves.push(...gs);save();render()})};
    if(!tx)focusLater('eAmt')};
  draw()}
$('bRcv').onclick=()=>entrySheet('i');
document.addEventListener('click',e=>{const b=e.target.closest('.tx');if(!b)return;const t=S.txns.find(x=>x.id===b.dataset.id);if(t)entrySheet(t.t,t)});

// Quick buttons
$('quick').onclick=e=>{const b=e.target.closest('.qb');if(!b)return;const q=quick()[+b.dataset.q];if(!q)return;
  const rec={id:uid(),t:'e',a:q.a,c:q.c,n:q.n,d:day,m:'Cash',ts:Date.now()};S.txns.push(rec);save();render();
  toast(q.n+' · '+inr(q.a)+' added',()=>{S.txns=S.txns.filter(x=>x.id!==rec.id);save();render()})};
$('qEdit').onclick=()=>{let list=quick().map(q=>({...q}));
  const draw=()=>{openSheet(`<h3>Quick add buttons</h3><p class="lbl" style="margin-top:0">One tap adds the item as cash spent.</p>
    <div id="qRows">${list.map((q,i)=>`<div class="hrow"><span>${esc(q.n)} · <span class="num">${inr(q.a)}</span> <span class="lbl">· ${esc(q.c)}</span></span><button class="x" data-i="${i}" aria-label="Remove">×</button></div>`).join('')||'<div class="lbl">No buttons yet.</div>'}</div>
    <div class="two" style="margin-top:14px"><label class="f">Name<input id="qN" maxlength="16" placeholder="e.g. Chai"></label><label class="f">Amount ₹<input id="qA" inputmode="numeric" placeholder="20"></label></div>
    <div class="chips" id="qC">${chips(CAT_OUT,'Food')}</div><div class="err" id="qErr"></div>
    <div class="btns"><button type="button" class="ghost" id="qAdd">Add button</button><button type="button" class="save" id="qDone">Done</button></div>`);
    let qc='Food';bindChips($('qC'),v=>qc=v);
    $('qRows').onclick=e=>{const b=e.target.closest('.x');if(b){list.splice(+b.dataset.i,1);draw()}};
    $('qAdd').onclick=()=>{const n=$('qN').value.trim(),a=num($('qA').value);if(!n||!(a>0)){$('qErr').textContent='Enter a name and an amount';return}
      if(list.length>=12){$('qErr').textContent='Up to 12 buttons';return}list.push({n:n.slice(0,16),a:Math.round(a),c:qc});draw()};
    $('qDone').onclick=()=>{S.quick=list;save();closeSheet();render()}};
  draw()};

// ---------- Menu & profile ----------
const BIRD='<svg class="bird" viewBox="12 6 82 82"><path class="wb" d="M50 54 C 52 40, 60 27, 76 18 C 72 30, 66 42, 58 54 Z" fill="#c43c00"/><path d="M20 52 C 30 46, 44 46, 56 52 C 64 50, 72 46, 80 47 C 74 52, 70 56, 66 60 C 58 70, 44 74, 32 70 L 22 78 L 24 66 C 20 62, 18 57, 20 52 Z" fill="#ff4f00"/><path class="wf" d="M38 52 C 36 38, 40 26, 50 16 C 54 30, 56 42, 54 54 Z" fill="#ff7a33"/><path d="M79 46 L 88 47 L 79 50 Z" fill="#ffb43c"/><circle cx="72" cy="49.5" r="1.8" fill="#111214"/></svg>';
function openMenu(){rWho();document.querySelectorAll('.mi[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===cur));$('dlayer').classList.add('open')}
function closeMenu(){$('dlayer').classList.remove('open')}
$('burger').onclick=openMenu;
document.querySelector('.drawer').onclick=e=>{const b=e.target.closest('.mi[data-v]');if(b){closeMenu();setView(b.dataset.v)}};
function rWho(){const p=S.profile;$('mAv').classList.toggle('e',!p);if(p)$('mAv').textContent=p.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();else $('mAv').innerHTML=BIRD;
  $('mName').textContent=p?p.name:'Not signed in';$('mSign').textContent=p?'Edit profile':'Sign in';$('mProfL').textContent=p?'Profile':'Sign in'}
$('mSign').onclick=$('mProf').onclick=()=>{closeMenu();profile()};
function profile(){const p=S.profile||{};let arm=false;
  openSheet(`<h3>${S.profile?'Your profile':'Sign in'}</h3><p class="lbl" style="margin-top:0">Saved on this phone.</p>
  <label class="f">Name<input id="pN" maxlength="40" autocomplete="name" value="${esc(p.name||'')}" placeholder="Your name"></label>
  <label class="f">Email (optional)<input id="pE" type="email" maxlength="80" autocomplete="email" value="${esc(p.email||'')}" placeholder="you@example.com"></label>
  <label class="f">Phone (optional)<input id="pP" type="tel" maxlength="20" autocomplete="tel" value="${esc(p.phone||'')}" placeholder="+91"></label><div class="err" id="pErr"></div>
  <div class="btns">${S.profile?'<button type="button" class="ghost red" id="pOut">Sign out</button>':''}<button type="button" class="save" id="pSave">${S.profile?'Save':'Sign in'}</button></div>`);
  if(!S.profile)focusLater('pN');
  if($('pOut'))$('pOut').onclick=()=>{if(!arm){arm=true;$('pOut').textContent='Tap again';return}S.profile=null;save();closeSheet();toast('Signed out')};
  $('pSave').onclick=()=>{const n=$('pN').value.trim(),em=$('pE').value.trim(),ph=$('pP').value.trim();
    if(!n){$('pErr').textContent='Enter your name';return}
    if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){$('pErr').textContent='Enter a valid email';return}
    if(ph&&!/^[+\d][\d\s-]{6,18}$/.test(ph)){$('pErr').textContent='Enter a valid phone number';return}
    const was=!!S.profile;S.profile={name:n.slice(0,40),email:em.slice(0,80),phone:ph.slice(0,20)};save();closeSheet();toast(was?'Profile saved':'Welcome, '+n.split(' ')[0])}}

// ---------- Toast ----------
let toastT=null,undoFn=null;
function toast(msg,undo){$('tmsg').textContent=msg;undoFn=undo||null;$('tbtn').hidden=!undo;$('toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('show'),4000)}
$('tbtn').onclick=()=>{if(undoFn){const f=undoFn;undoFn=null;f();toast('Restored')}};

// ---------- Live updates (Android shell) ----------
window.paisaUpdate=()=>{const busy=()=>document.querySelector('.layer.open')||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  const go=()=>{if(!(AND&&AND.reload))return;try{localStorage.setItem(LS+'-updated','1')}catch(e){}AND.reload()};
  if(!busy()){go();return}clearInterval(window.__updT);window.__updT=setInterval(()=>{if(!busy()){clearInterval(window.__updT);go()}},2000)};
try{if(localStorage.getItem(LS+'-updated')){localStorage.removeItem(LS+'-updated');setTimeout(()=>toast('FreeBird updated'),400)}}catch(e){}

// ---------- Start ----------
load();
{let v='flow';try{v=localStorage.getItem(LS+'-view2')||'flow'}catch(e){}setView(TITLES[v]?v:'flow')}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(day>today())day=today();render()}});
}
</script>
</body>
</html>
